name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The same Node.js version as in deploy.yml, so that a build that passes here also passes there.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install the packages
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run type-check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
